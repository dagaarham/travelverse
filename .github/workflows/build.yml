name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build signed release APK and App Bundle
        run: |
          flutter build apk --release
          flutter build appbundle --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/TouchGrass.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/TouchGrass.aab
      - uses: actions/upload-artifact@v4
        with:
          name: TouchGrass-android
          path: dist/
      - name: Remove files from before the TouchGrass rename
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in TravelVerse.apk TravelVerse.aab; do
            gh release delete-asset latest "$f" -R "$GITHUB_REPOSITORY" -y || true
          done
      - name: Publish to the "latest" GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TouchGrass (latest build)
          prerelease: false
          make_latest: true
          body: |
            Install **TouchGrass.apk** on an Android phone (allow "Install unknown apps" for your browser or Files app).
            Built from commit ${{ github.sha }}.
          files: |
            dist/TouchGrass.apk
            dist/TouchGrass.aab

  web:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web app for GitHub Pages
        run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"
      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
