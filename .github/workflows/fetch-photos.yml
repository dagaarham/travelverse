name: Fetch place photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tool/fetch_place_photos.py
      - .github/workflows/fetch-photos.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Download photos
        id: fetch
        continue-on-error: true
        run: python tool/fetch_place_photos.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/places
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add bundled place photos from Wikimedia Commons"
          git push
      - name: Fail if any place is missing a photo
        if: steps.fetch.outcome == 'failure'
        run: exit 1
